<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-container">

        <!-- LEFT SIDE -->
        <div class="left-section">

            <div class="illustration">
                <!-- Replace this with your own illustration -->
                <img src="./images/shopintro.png" alt="Shipping illustration">
            </div>

            <div class="logo">
                <span class="logo-icon">📦</span>
                <span>Shipin</span>
            </div>

        </div>


        <!-- RIGHT SIDE -->
        <div class="right-section">

            <div class="login-form">

                <h1>Welcome to ShoeNova</h1>

                <p class="subtitle">
                    Ship Smarter Today
                </p>


                <!-- Username -->
                <div class="input-container">

                    <svg
                        class="input-icon"
                        width="22"
                        height="22"
                        viewBox="0 0 24 24"
                        fill="none"
                    >
                        <path
                            d="M4 4H20C21.1 4 22 4.9 22 6V18C22 19.1 21.1 20 20 20H4C2.9 20 2 19.1 2 18V6C2 4.9 2.9 4 4 4Z"
                            stroke="currentColor"
                            stroke-width="2"
                        />

                        <path
                            d="M22 6L12 13L2 6"
                            stroke="currentColor"
                            stroke-width="2"
                        />
                    </svg>

                    <input
                        type="email"
                        placeholder="Username or email"
                    >

                </div>


                <!-- Password -->
                <div class="input-container">

                    <svg
                        class="input-icon"
                        width="22"
                        height="22"
                        viewBox="0 0 24 24"
                        fill="none"
                    >
                        <rect
                            x="4"
                            y="10"
                            width="16"
                            height="11"
                            rx="2"
                            stroke="currentColor"
                            stroke-width="2"
                        />

                        <path
                            d="M8 10V7C8 4.79 9.79 3 12 3C14.21 3 16 4.79 16 7V10"
                            stroke="currentColor"
                            stroke-width="2"
                        />
                    </svg>

                    <input
                        type="password"
                        placeholder="Password"
                    >

                </div>


                <!-- Remember + Forgot -->
                <div class="options">

                    <label class="remember">

                        <input type="checkbox">

                        <span>Remember Me</span>

                    </label>

                    <a href="#">Forgot Password?</a>

                </div>


                <!-- Login Button -->
                <button class="login-btn">

                    <span>Sign In</span>

                    <svg
                        width="22"
                        height="22"
                        viewBox="0 0 24 24"
                        fill="none"
                    >
                        <path
                            d="M13 5L20 12L13 19"
                            stroke="white"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />

                        <path
                            d="M20 12H4"
                            stroke="white"
                            stroke-width="2"
                            stroke-linecap="round"
                        />
                    </svg>

                </button>

            </div>

        </div>

    </div>

</body>
</html>
